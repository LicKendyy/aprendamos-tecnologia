  <script>
const app={
  courses:[],activeCourse:null,activeClass:null,courseTab:"classes",classTab:"attendance",
  timer:3300,timerHandle:null,noise:{active:false,left:10,timer:null,beep:null,penalty:2,audio:false},lastVoice:"",voiceRate:.95,voiceUri:""
};
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
const uid=p=>p+Date.now()+Math.random().toString(16).slice(2);
const course=()=>app.courses.find(c=>c.id===app.activeCourse);
const cls=()=>course()?.classes.find(c=>c.id===app.activeClass);
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

// CONFIGURACIÓN: reemplaza estos dos valores con los de tu proyecto Supabase.
const SUPABASE_URL = "https://lbhnxmyxkenrwtncjpyd.supabase.co";
const SUPABASE_KEY = "sb_publishable_f3OY7F11W0MFTifT5l_N4w_-fywyJSD";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let loadingData = false;
let saveTimer = null;
let saveQueue = Promise.resolve();
const proxyCache = new WeakMap();
const observedProxies = new WeakSet();

function observe(value) {
  if (!value || typeof value !== "object") return value;
  if (observedProxies.has(value)) return value;
  if (proxyCache.has(value)) return proxyCache.get(value);
  const proxy = new Proxy(value, {
    get(target, property, receiver) {
      return observe(Reflect.get(target, property, receiver));
    },
    set(target, property, newValue, receiver) {
      const result = Reflect.set(target, property, newValue, receiver);
      if (result) scheduleSave();
      return result;
    },
    deleteProperty(target, property) {
      const result = Reflect.deleteProperty(target, property);
      if (result) scheduleSave();
      return result;
    }
  });
  proxyCache.set(value, proxy);
  observedProxies.add(proxy);
  return proxy;
}

function scheduleSave() {
  if (!currentUser || loadingData) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveQueue = saveQueue.then(() => saveState()).catch(error => {
      console.error("Error guardando datos en Supabase:", error);
      toast("No se pudo guardar. Revisa tu conexión.");
    });
  }, 800);
}

async function saveState() {
  if (!currentUser) return;
  const coursesCopy = JSON.parse(JSON.stringify(app.courses));
  const { error } = await sb.from("teacher_state").upsert({
    user_id: currentUser.id,
    courses: coursesCopy,
    updated_at: new Date().toISOString()
  }, { onConflict: "user_id" });
  if (error) throw error;
}

async function startApp() {
  const loginView = $("login-view");
  const appShell = document.querySelector(".app-shell");
  const errorBox = $("login-error");
  try {
    const { data, error: authError } = await sb.auth.getUser();
    if (authError?.name === "AuthSessionMissingError") {
      currentUser = null;
      if (errorBox) errorBox.textContent = "";
      loginView.style.display = "block";
      appShell.style.display = "none";
      return;
    }
    if (authError) throw authError;
    currentUser = data.user;
    if (!currentUser) {
      loginView.style.display = "block";
      appShell.style.display = "none";
      return;
    }
    loadingData = true;
    const { data: saved, error } = await sb.from("teacher_state")
      .select("courses").eq("user_id", currentUser.id).maybeSingle();
    if (error) throw error;
    app.courses = observe(saved ? (saved.courses || []) : []);
    loadingData = false;
    loginView.style.display = "none";
    appShell.style.display = "";
    renderHome();
    icons();
    if (!saved) await saveState();
  } catch (error) {
    loadingData = false;
    console.error("No se pudo iniciar la plataforma:", error);
    loginView.style.display = "block";
    appShell.style.display = "none";
    if (errorBox) errorBox.textContent = "No se pudieron cargar los datos. Verifica la configuración de Supabase y vuelve a intentarlo.";
  }
}

async function login(event) {
  event.preventDefault();
  const form = event.target;
  const values = new FormData(form);
  const errorBox = $("login-error");
  errorBox.textContent = "";
  const { error } = await sb.auth.signInWithPassword({
    email: values.get("email"),
    password: values.get("password")
  });
  if (error) {
    errorBox.textContent = "No se pudo iniciar sesión. Revisa el correo y la contraseña.";
    console.error(error);
    return;
  }
  await startApp();
}

async function logout() {
  const { error } = await sb.auth.signOut();
  if (error) {
    toast("No se pudo cerrar sesión. Intenta de nuevo.");
    console.error("Error al cerrar sesión:", error);
    return;
  }
  window.location.reload();
}

function icons(){if(window.lucide)lucide.createIcons()}
function toast(text){$("toast").textContent=text;$("toast").classList.add("show");clearTimeout(app.toastTimer);app.toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2800)}
function switchView(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$(id).classList.add("active");icons()}
function showModal(title,html,kind=""){ $("modal-title").textContent=title;$("modal-body").innerHTML=html;$("modal-box").className="modal "+kind;$("modal-wrap").classList.add("show");icons()}
function closeModal(){$("modal-wrap").classList.remove("show");$("modal-box").className="modal"}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(app.noise.active)stopNoise();else closeModal()}});

function makeClass(n){
 return {id:uid("cl"),title:"Clase "+n,date:"2026-09-25",status:"Pendiente",group:0,calls:0,penalty:2,attendance:{},attendanceRewarded:false,missions:[{id:uid("m"),title:"Circuito de ideas",description:"Diseñen un circuito simple en equipo.",time:"20 min",points:5,status:"pending",awarded:false,files:[]}],materials:[],history:["Clase creada con 0 / 50 puntos del equipo"],check:[false,false,false,false]};
}
function goHome(){app.activeCourse=null;app.activeClass=null;$("active-tools").classList.add("hidden");renderHome();switchView("home-view")}
function renderHome(){
 $("course-list").innerHTML=app.courses.length?app.courses.map(c=>`<article class="panel overflow-hidden"><div class="h-2 bg-gradient-to-r from-blue-600 via-sky-400 to-green-500"></div><div class="p-5"><div class="flex justify-between gap-3"><div><span class="badge bg-sky-100 text-blue-700"><i data-lucide="users"></i>${c.students.length} estudiantes</span><h3 class="brand text-2xl mt-3">${esc(c.name)}</h3><p class="text-slate-500 text-sm mt-1">${c.classes.length} clases · ${c.tasks.length} tareas</p></div><span class="text-4xl">💻</span></div><div class="grid grid-cols-2 gap-2 mt-5"><button class="game-btn primary col-span-2" onclick="openCourse('${c.id}')"><i data-lucide="arrow-right"></i>Ingresar</button><button class="game-btn soft" onclick="openCourseModal('${c.id}')"><i data-lucide="pencil"></i>Editar curso</button><button class="game-btn soft" onclick="duplicateCourse('${c.id}')"><i data-lucide="copy"></i>Duplicar curso</button><button class="game-btn danger col-span-2" onclick="confirmDeleteCourse('${c.id}')"><i data-lucide="trash-2"></i>Eliminar curso</button></div></div></article>`).join(""):`<div class="panel p-8 text-center md:col-span-2"><h3 class="brand text-2xl">Aún no tienes cursos</h3><p class="text-slate-500 mt-2">Crea tu primer curso para comenzar.</p><button class="game-btn primary mt-4" onclick="openCourseModal()">Crear curso</button></div>`;icons();
}
function duplicateCourse(id){
 const source=app.courses.find(c=>c.id===id);if(!source)return;
 const copy=structuredClone(source);copy.id=uid("c");
 const base=source.name.replace(/ \(copia(?: \d+)?\)$/i,"");
 const copies=app.courses.filter(c=>c.name===base||c.name.startsWith(base+" (copia")).length;
 copy.name=base+" "+(copies+1);
 copy.classes=copy.classes.map((x,i)=>{const cl=structuredClone(x);cl.id=uid("cl");cl.title=x.title;cl.group=0;cl.calls=0;cl.attendance={};cl.attendanceRewarded=false;cl.check=[false,false,false,false];cl.status="Pendiente";cl.history=["Clase duplicada con 0 / 50 puntos del equipo"];cl.missions=cl.missions.map(m=>({...m,id:uid("m"),status:"pending",awarded:false,files:m.files.map(f=>({...f,id:uid("f")}))}));cl.materials=cl.materials.map(f=>({...f,id:uid("f")}));return cl});
 copy.tasks=copy.tasks.map(t=>({...t,id:uid("t"),deliveries:{},awarded:{}}));
 copy.materials=copy.materials.map(f=>({...f,id:uid("f")}));
 app.courses.push(copy);renderHome();toast("Curso duplicado correctamente.");
}

function spanishVoices(){return speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("es"))}
function recommendedVoice(){let vs=spanishVoices();return vs.find(v=>/^es-co/i.test(v.lang))||vs.find(v=>/^es-es/i.test(v.lang))||vs[0]}
function voiceOptions(){
 const vs=spanishVoices(), rec=recommendedVoice();
 if(!app.voiceUri&&rec)app.voiceUri=rec.voiceURI;
 return vs.length?vs.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===app.voiceUri?"selected":""}>${esc(v.name)} — ${v.lang}${v.voiceURI===rec.voiceURI?" (recomendada)":""}</option>`).join(""):`<option value="">Voz predeterminada del dispositivo</option>`;
}
function renderAttendance(){
 const c=cls(),students=course().students,present=students.filter(s=>c.attendance[s.id]!==false).length;
 return `<div class="flex flex-wrap justify-between gap-3"><div><h2 class="brand text-2xl">Llamado a lista con voz</h2><p class="text-slate-500">Escucha cada nombre y marca la asistencia.</p></div><span class="badge bg-green-100 text-green-700">${present}/${students.length} presentes</span></div><div class="card mt-4 bg-sky-50"><div class="grid md:grid-cols-3 gap-3 items-end"><label class="font-bold">Voz<select class="form-control mt-1" onchange="app.voiceUri=this.value">${voiceOptions()}</select></label><label class="font-bold">Velocidad<select class="form-control mt-1" onchange="app.voiceRate=Number(this.value)"><option value=".85" ${app.voiceRate===.85?"selected":""}>Lenta · 0.85</option><option value=".95" ${app.voiceRate===.95?"selected":""}>Clara recomendada · 0.95</option><option value="1" ${app.voiceRate===1?"selected":""}>Normal · 1.0</option></select></label><div class="flex gap-2"><button class="game-btn primary flex-1" onclick="nextVoice()"><i data-lucide="skip-forward"></i>Siguiente</button><button class="game-btn soft px-3" onclick="stopVoice()" aria-label="Detener voz"><i data-lucide="square"></i></button></div></div><p id="voice-status" class="text-sm font-bold text-blue-700 mt-3" aria-live="polite">${spanishVoices().length?"Voz española disponible.":"No hay voz española disponible; se usará la voz predeterminada."}</p></div><div class="space-y-2 mt-4">${students.map(s=>{const p=c.attendance[s.id]!==false;return `<article class="card flex flex-wrap items-center gap-3"><span class="text-3xl">${s.avatar}</span><div class="flex-1"><b>${esc(s.name)}</b><p class="text-xs text-slate-500">${s.points} puntos personales</p></div><button class="game-btn soft" onclick="sayName('${s.id}')"><i data-lucide="volume-2"></i>Nombrar</button><button class="game-btn ${p?"green":"danger"}" onclick="toggleAttendance('${s.id}')">${p?"Presente":"Ausente"}</button><button class="game-btn soft px-3" onclick="openProfile('${s.id}')" aria-label="Ver perfil"><i data-lucide="user-round"></i></button></article>`}).join("")}</div><div class="flex flex-wrap gap-2 mt-5"><button class="game-btn soft" onclick="repeatVoice()"><i data-lucide="repeat-2"></i>Repetir nombre</button><button class="game-btn primary" onclick="confirmAttendance()"><i data-lucide="check-circle"></i>Confirmar asistencia y otorgar puntos</button></div>`;
}
function sayName(id){
 const s=course().students.find(x=>x.id===id);app.lastVoice=s.name;const u=new SpeechSynthesisUtterance(s.name);const voices=speechSynthesis.getVoices(),v=voices.find(x=>x.voiceURI===app.voiceUri)||recommendedVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="es-CO";u.rate=app.voiceRate;u.volume=.9;u.onstart=()=>{$("voice-status").textContent="Reproduciendo: "+s.name};u.onend=()=>{$("voice-status").textContent="Listo para continuar."};speechSynthesis.cancel();speechSynthesis.speak(u);
}
function nextVoice(){const ss=course().students;app.voiceIndex=(app.voiceIndex||0)%ss.length;sayName(ss[app.voiceIndex++].id)}
function repeatVoice(){if(app.lastVoice){const fake=course().students.find(s=>s.name===app.lastVoice);if(fake)sayName(fake.id)}}
function stopVoice(){speechSynthesis.cancel();$("voice-status").textContent="Voz detenida."}
function toggleAttendance(id){const c=cls();c.attendance[id]=c.attendance[id]===false;showClassTab("attendance")}
function updateStudentPoints(studentId,amount,reason){
 const s=course().students.find(x=>x.id===studentId);if(!s)return;const before=s.points;s.points=Math.max(0,s.points+amount);const actual=s.points-before;
 const entry={date:new Date().toLocaleString("es-CO"),type:actual>=0?"suma":"descuento",amount:actual,reason:reason||"Ajuste docente",result:s.points};
 s.history.unshift(entry);return {student:s,actual};
}

 course().students.filter(s=>c.attendance[s.id]!==false).forEach(s=>updateStudentPoints(s.id,2,"Asistencia confirmada"));
 c.attendanceRewarded=true;c.history.unshift("Asistencia confirmada y puntos personales otorgados.");showClassTab("attendance");toast("Asistencia confirmada y puntos actualizados.");

function renderMissions(){
 const c=cls();
 return `<div class="flex flex-wrap justify-between gap-3"><div><h2 class="brand text-2xl">Misiones</h2><p class="text-slate-500">Retos cortos para aprender creando.</p></div><button class="game-btn primary" onclick="openMissionModal()"><i data-lucide="plus"></i>Nueva misión</button></div><div class="space-y-3 mt-5">${c.missions.map(m=>`<article class="card"><div class="flex justify-between gap-3"><div><span class="badge ${m.status==="done"?"bg-green-100 text-green-700":"bg-orange-100 text-orange-700"}">${m.status==="done"?"✓ Cumplida":"🚀 Disponible"}</span><h3 class="font-extrabold text-lg mt-2">${esc(m.title)}</h3><p class="text-slate-600 text-sm">${esc(m.description)}</p><p class="font-bold text-blue-700 text-sm mt-2">⏱ ${esc(m.time)} · ${m.points} puntos personales</p></div><div class="flex gap-1"><button class="game-btn soft px-3" onclick="openMissionModal('${m.id}')" aria-label="Editar misión"><i data-lucide="pencil"></i></button><button class="game-btn danger px-3" onclick="deleteMission('${m.id}')" aria-label="Eliminar misión"><i data-lucide="trash-2"></i></button></div></div><div class="mt-4 flex flex-wrap gap-2">${m.status!=="done"?`<button class="game-btn green" onclick="completeMission('${m.id}')"><i data-lucide="flag"></i>Completar misión</button>`:`<span class="badge bg-green-100 text-green-700">¡Misión cumplida!</span>`}<button class="game-btn primary" onclick="openFileModal('mission','${m.id}')"><i data-lucide="upload"></i>Subir archivo</button><button class="game-btn soft" onclick="openLinkModal('mission','${m.id}')"><i data-lucide="link"></i>Agregar enlace</button></div><div class="space-y-2 mt-3">${renderFiles(m.files,"mission",m.id)}</div></article>`).join("")||`<div class="card text-center text-slate-500">No hay misiones todavía. Crea una misión para empezar.</div>`}</div>`;

function renderFiles(files,scope,parentId){
 if(!files.length)return `<p class="text-sm text-slate-500">Aún no hay archivos adjuntos.</p>`;
 return files.map(f=>`<article class="file-card ${fileKind(f.ext)} card flex flex-wrap items-center gap-3"><span class="w-12 h-12 grid place-items-center rounded-xl bg-sky-50 text-2xl">${fileIcon(f.ext)}</span><div class="flex-1 min-w-[180px]"><b>${esc(f.name)}</b><p class="text-sm text-slate-500">${esc(f.ext.toUpperCase())} · ${formatSize(f.size)} · ${esc(f.date)}</p><span class="badge bg-green-100 text-green-700">${f.status}</span></div><div class="flex flex-wrap gap-2"><button class="game-btn soft px-3" onclick="openFile('${scope}','${parentId}','${f.id}')"><i data-lucide="eye"></i>Abrir</button><button class="game-btn green px-3" onclick="downloadFile('${scope}','${parentId}','${f.id}')"><i data-lucide="download"></i>Descargar</button><button class="game-btn orange px-3" onclick="replaceFile('${scope}','${parentId}','${f.id}')"><i data-lucide="refresh-cw"></i>Reemplazar</button><button class="game-btn danger px-3" onclick="removeFile('${scope}','${parentId}','${f.id}')"><i data-lucide="trash-2"></i>Eliminar</button></div></article>`).join("");
}
function fileKind(ext){return ext==="pdf"?"pdf":["doc","docx"].includes(ext)?"word":["ppt","pptx"].includes(ext)?"power":""}
function fileIcon(ext){return ext==="pdf"?"📕":["doc","docx"].includes(ext)?"📘":["ppt","pptx"].includes(ext)?"📙":"🔗"}
function formatSize(size){return size<1024?size+" B":(size/1024/1024).toFixed(1)+" MB"}
function fileList(scope,parentId){if(scope==="course")return course().materials;if(scope==="class")return cls().materials;return cls().missions.find(m=>m.id===parentId).files}

}
function openFileModal(scope,parentId,replacingId=""){
 showModal(replacingId?"Reemplazar archivo":"Subir archivo",`<form onsubmit="saveFile(event,'${scope}','${parentId}','${replacingId}')"><label class="font-bold">Selecciona un archivo PDF, DOC, DOCX, PPT o PPTX<input class="form-control mt-2" name="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" required></label><p class="text-sm text-slate-500 mt-3">El archivo se conservará durante esta sesión y quedará vinculado a esta sección.</p><button class="game-btn primary mt-5" type="submit"><i data-lucide="upload"></i>Guardar archivo</button></form>`);
}
function saveFile(e,scope,parentId,replacingId){
 e.preventDefault();const file=new FormData(e.target).get("file"),ext=file.name.split(".").pop().toLowerCase(),allowed=["pdf","doc","docx","ppt","pptx"];
 if(!allowed.includes(ext)){toast("Formato no compatible. Usa PDF, DOC, DOCX, PPT o PPTX.");return}
 const item={id:uid("f"),name:file.name,ext,size:file.size,date:new Date().toLocaleDateString("es-CO"),status:"Disponible",url:URL.createObjectURL(file),file};
 const list=fileList(scope,parentId);if(replacingId){const i=list.findIndex(f=>f.id===replacingId);if(i>=0){URL.revokeObjectURL(list[i].url);list[i]=item}}else list.push(item);
 closeModal();renderCurrent(scope);toast(replacingId?"Archivo reemplazado correctamente.":"Archivo subido correctamente.");
}
function renderCurrent(scope){scope==="course"?showCourseTab("materials"):showClassTab(scope==="mission"?"missions":"materials")}
function openLinkModal(scope,parentId){
 showModal("Agregar enlace",`<form onsubmit="saveLink(event,'${scope}','${parentId}')"><label class="font-bold">Nombre<input class="form-control mt-1" name="name" required></label><label class="font-bold block mt-3">Enlace<input class="form-control mt-1" name="url" type="url" required placeholder="https://"></label><button class="game-btn primary mt-5">Guardar enlace</button></form>`);
}
function saveLink(e,scope,parentId){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));fileList(scope,parentId).push({id:uid("l"),name:d.name,ext:"enlace",size:0,date:new Date().toLocaleDateString("es-CO"),status:"Disponible",url:d.url,file:null});closeModal();renderCurrent(scope);toast("Enlace agregado correctamente.");}
function findFile(scope,parent,id){return fileList(scope,parent).find(f=>f.id===id)}
function openFile(scope,parent,id){
 const f=findFile(scope,parent,id);if(f.ext==="pdf"&&f.file){showModal("Vista previa: "+f.name,`<iframe class="file-preview" src="${f.url}" title="Vista previa del PDF"></iframe><div class="mt-4"><button class="game-btn green" onclick="downloadFile('${scope}','${parent}','${id}')"><i data-lucide="download"></i>Descargar PDF</button></div>`);return}
 if(f.ext==="enlace"){window.open(f.url,"_blank","noopener");return}

function startNoise(){
 if(!cls()){toast("Ingresa a una clase para usar el control de ruido.");return}if(app.noise.active)return;

function renderNoiseModal(){
 showModal("ALERTA DE RUIDO",`<div class="text-center"><i data-lucide="megaphone" class="mx-auto" style="width:92px;height:92px"></i><h3 class="font-black text-4xl mt-3 tracking-wide">ALERTA DE RUIDO</h3><p class="text-xl font-bold mt-3">El equipo debe bajar el ruido.</p><p id="noise-count" class="text-8xl font-black my-5">${app.noise.left}</p><p class="text-lg">Si la alerta llega a cero, el equipo pierde puntos.</p><div class="progress mt-5"><span id="noise-progress" style="width:${app.noise.left*10}%"></span></div><div class="flex flex-wrap justify-center gap-3 mt-6"><button class="game-btn bg-white text-red-700 text-lg px-5 py-4" onclick="stopNoise(true)"><i data-lucide="shield-check"></i>Detener alerta y evitar penalización</button></div><p id="sound-status" class="mt-3 text-sm font-bold">Alerta sonora activa mientras dura la cuenta regresiva.</p></div>`,"noise-modal");

function tickNoise(){
 app.noise.left--;const count=$("noise-count"),bar=$("noise-progress");if(count)count.textContent=app.noise.left;if(bar)bar.style.width=(app.noise.left*10)+"%";
 if(app.noise.left>0&&app.noise.left%2===0)playBeep();
 if(app.noise.left<=0){clearInterval(app.noise.timer);app.noise.timer=null;const penalty=app.noise.penalty;app.noise.active=false;$("noise-top-button").classList.remove("active");changeGroup(-penalty,"Penalización por ruido",false);showModal("Resultado de la alerta",`<div class="text-center"><div class="text-6xl">📢</div><h3 class="brand text-3xl mt-3">-${penalty} puntos del equipo por ruido</h3><p class="text-slate-600 mt-3">La alerta llegó a cero. Puntos actuales: ${cls().group} / 50.</p><button class="game-btn primary mt-6" onclick="closeModal();showClassTab('noise')">Cerrar</button></div>`);toast("Se aplicó la penalización por ruido.");}

function playBeep(){
 if(!app.noise.audio)return;
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  const ctx=new AudioContextClass();
  if(ctx.state==="suspended")ctx.resume();
  const tones=[{frequency:880,offset:0},{frequency:660,offset:.28},{frequency:880,offset:.56}];
  tones.forEach(({frequency,offset})=>{
   const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+offset;
   osc.type="square";osc.frequency.value=frequency;
   gain.gain.setValueAtTime(.0001,start);
   gain.gain.exponentialRampToValueAtTime(.16,start+.02);
   gain.gain.exponentialRampToValueAtTime(.0001,start+.2);
   osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.22);
  });
  setTimeout(()=>ctx.close(),900);
 }catch(e){const status=$("sound-status");if(status)status.textContent="La alerta visual sigue activa, pero no se pudo reproducir el sonido."}
}
function stopNoise(preventPenalty){

}

function openRewardShop(studentId){
 const s=course().students.find(x=>x.id===studentId);
 if(!s)return;
 const html=`<p class="text-slate-600">Saldo disponible: <b>${s.points} puntos</b>. Elige una insignia o un privilegio para canjear.</p><div class="grid md:grid-cols-2 gap-3 mt-4">${REWARD_CATALOG.map(r=>{
  const owned=r.type==="badge"&&(s.badges||[]).some(b=>b&&(typeof b==="string"?b===r.id:b.id===r.id));
  const canRedeem=s.points>=r.cost;
  const label=owned?"Ya canjeada":canRedeem?"Canjear premio":`Faltan ${r.cost-s.points} puntos`;
  return `<article class="card flex flex-col gap-2"><div class="text-4xl">${r.emoji}</div><h3 class="font-extrabold">${esc(r.name)}</h3><p class="text-sm text-slate-600 flex-1">${esc(r.description)}</p><p class="font-bold text-blue-700">${r.cost} puntos</p><button class="game-btn ${canRedeem&&!owned?"green":"soft"}" ${!canRedeem||owned?"disabled":""} onclick="redeemReward('${studentId}','${r.id}')">${label}</button></article>`;
 }).join("")}</div>`;
 showModal("Tienda de premios",html);
}
function redeemReward(studentId,rewardId){
 const s=course().students.find(x=>x.id===studentId),reward=REWARD_CATALOG.find(r=>r.id===rewardId);
 if(!s||!reward)return;
 if(s.points<reward.cost)return toast("Aún faltan puntos para ese premio.");
 if(reward.type==="badge"&&(s.badges||[]).some(b=>b&&(typeof b==="string"?b===reward.id:b.id===reward.id)))return toast("Esta insignia ya fue canjeada.");
 s.points-=reward.cost;
 const date=new Date().toLocaleString("es-CO");
 if(reward.type==="badge"){
  if(!Array.isArray(s.badges))s.badges=[];
  s.badges.push({id:reward.id,name:reward.name,emoji:reward.emoji,date});
 }else{
  if(!Array.isArray(s.rewards))s.rewards=[];
  s.rewards.unshift({id:uid("rw"),name:reward.name,emoji:reward.emoji,date});
 }
 s.history.unshift({date,type:"canje",amount:-reward.cost,reason:`Canje: ${reward.name}`,result:s.points,reward:reward.emoji});
 closeModal();openProfile(studentId);toast(`${reward.emoji} Premio canjeado: ${reward.name}`);
}

function stopTimer(){clearInterval(app.timerHandle);app.timerHandle=null}
function toggleTimer(){if(app.timerHandle){stopTimer();$("timer-toggle").innerHTML="<i data-lucide='play'></i>"}else{app.timerHandle=setInterval(()=>{if(app.timer>0){app.timer--;updateTimer()}else stopTimer()},1000);$("timer-toggle").innerHTML="<i data-lucide='pause'></i>"}icons()}
function updateTimer(){const m=Math.floor(app.timer/60),s=app.timer%60;$("timer-display").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
document.addEventListener("DOMContentLoaded",()=>{startApp();if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{if(app.activeClass&&app.classTab==="attendance")showClassTab("attendance")}}});
</script>
 
</body></html>
